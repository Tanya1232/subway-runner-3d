<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Runner Telegram</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Firebase SDK (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            z-index: 10;
        }
        .stats-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            border-radius: 12px;
            display: inline-block;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .yellow { color: #ffd700; }
        .green { color: #2ecc71; }
        
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 32px; margin-bottom: 10px; color: #ff4757; }
        p { font-size: 18px; margin-bottom: 20px; }
        
        button {
            background: #2ed573;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div>
            <div class="stats-panel">
                Игрок: <span id="user-name">Гость</span><br>
                Монет за забег: <span id="run-coins" class="yellow">0</span><br>
                Всего в БД: <span id="db-coins" class="green">Загрузка...</span>
            </div>
        </div>
        <div class="stats-panel" style="align-self: flex-end;">
            Счет: <span id="score">0</span>
        </div>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>ИГРА ОКОНЧАНА</h1>
        <p>Собрано монет: <span id="final-coins" class="yellow">0</span></p>
        <p id="save-status">Сохранение в Firebase...</p>
        <button id="restart-btn" onclick="restartGame()">ИГРАТЬ СНОВА</button>
    </div>

    <script>
        // ==========================================
        // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
        // ==========================================
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const tgUser = tg.initDataUnsafe?.user;
        const userId = tgUser ? String(tgUser.id) : "test_user_123";
        const userName = tgUser ? tgUser.first_name : "Тестовый Игрок";

        document.getElementById('user-name').innerText = userName;

        // ==========================================
        // 2. ИНИЦИАЛИЗАЦИЯ FIREBASE (ТВОИ КЛЮЧИ ВСТАВЛЕНЫ)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAldWIqoZyCi6LBGONbYyMlT51Lu9zCv9E",
            authDomain: "subway-runner-8679e.firebaseapp.com",
            projectId: "subway-runner-8679e",
            storageBucket: "subway-runner-8679e.firebasestorage.app",
            messagingSenderId: "601251558444",
            appId: "1:601251558444:web:6240efd1d1738f2e650d89"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let totalUserCoins = 0;

        // Загрузка монет игрока из Firestore
        function loadUserCoins() {
            db.collection("users").doc(userId).get().then((doc) => {
                if (doc.exists) {
                    totalUserCoins = doc.data().coins || 0;
                } else {
                    totalUserCoins = 0;
                    db.collection("users").doc(userId).set({ coins: 0, name: userName });
                }
                document.getElementById('db-coins').innerText = totalUserCoins;
            }).catch((err) => {
                console.error("Ошибка Firebase:", err);
                document.getElementById('db-coins').innerText = "Ошибка";
            });
        }

        // Сохранение монет после забега
        function saveCoinsToFirebase(collectedInRun) {
            if (collectedInRun === 0) {
                document.getElementById('save-status').innerText = "Монеты не собраны";
                return;
            }

            document.getElementById('save-status').innerText = "Сохранение...";

            const userRef = db.collection("users").doc(userId);
            
            userRef.update({
                coins: firebase.firestore.FieldValue.increment(collectedInRun)
            }).then(() => {
                totalUserCoins += collectedInRun;
                document.getElementById('db-coins').innerText = totalUserCoins;
                document.getElementById('save-status').innerText = "Успешно сохранено!";
            }).catch(() => {
                userRef.set({
                    coins: collectedInRun,
                    name: userName
                }, { merge: true }).then(() => {
                    totalUserCoins += collectedInRun;
                    document.getElementById('db-coins').innerText = totalUserCoins;
                    document.getElementById('save-status').innerText = "Успешно сохранено!";
                });
            });
        }

        loadUserCoins();

        // ==========================================
        // 3. 3D ИГРОВАЯ ЛОГИКА (THREE.JS)
        // ==========================================
        let scene, camera, renderer;
        let player, playerBox;
        let currentLane = 0;
        const laneX = [-2, 0, 2];
        let targetX = 0;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -0.015;

        let obstacles = [];
        let coins = [];
        let score = 0;
        let coinsCollected = 0;
        let isGameOver = false;
        let speed = 0.2;

        function init3D() {
            const container = document.getElementById('game-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);
            scene.fog = new THREE.FogExp2(0x1a1a24, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3, 6);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            const roadGeo = new THREE.PlaneGeometry(7, 1000);
            const roadMat = new THREE.MeshBasicMaterial({ color: 0x333344 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -450;
            scene.add(road);

            for (let x of [-1, 1]) {
                const lineGeo = new THREE.PlaneGeometry(0.1, 1000);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(x, 0.01, -450);
                scene.add(line);
            }

            const playerGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0x00a8ff });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.6, 0);
            scene.add(player);

            playerBox = new THREE.Box3();

            window.addEventListener('resize', onWindowResize);
            setupControls();
            
            spawnInitialObjects();
            animate();
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLane(-1);
                if (e.code === 'ArrowRight' || e.code === 'KeyD') moveLane(1);
                if ((e.code === 'ArrowUp' || e.code === 'Space') && !isJumping) jump();
            });

            let touchStartX = 0;
            let touchStartY = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });

            document.addEventListener('touchend', (e) => {
                if (isGameOver) return;
                let diffX = e.changedTouches[0].clientX - touchStartX;
                let diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 30) moveLane(1);
                    else if (diffX < -30) moveLane(-1);
                } else {
                    if (diffY < -30 && !isJumping) jump();
                }
            });
        }

        function moveLane(dir) {
            currentLane = Math.max(-1, Math.min(1, currentLane + dir));
            targetX = laneX[currentLane + 1];
        }

        function jump() {
            isJumping = true;
            jumpVelocity = 0.25;
        }

        function spawnInitialObjects() {
            for (let i = 1; i < 15; i++) {
                spawnRow(-i * 15);
            }
        }

        function spawnRow(zPos) {
            const laneIndex = Math.floor(Math.random() * 3);
            const posX = laneX[laneIndex];

            if (Math.random() > 0.4) {
                const obsGeo = new THREE.BoxGeometry(1.2, 1, 1);
                const obsMat = new THREE.MeshLambertMaterial({ color: 0xff4757 });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(posX, 0.5, zPos);
                obs.box = new THREE.Box3();
                scene.add(obs);
                obstacles.push(obs);
            } else {
                const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
                const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(posX, 0.6, zPos);
                coin.box = new THREE.Box3();
                scene.add(coin);
                coins.push(coin);
            }
        }

        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            player.position.x += (targetX - player.position.x) * 0.2;

            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity += gravity;
                if (player.position.y <= 0.6) {
                    player.position.y = 0.6;
                    isJumping = false;
                }
            }

            playerBox.setFromObject(player);

            score++;
            document.getElementById('score').innerText = Math.floor(score / 5);

            let maxZ = 0;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;
                obs.box.setFromObject(obs);

                if (playerBox.intersectsBox(obs.box)) {
                    triggerGameOver();
                }

                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
                if (obs.position.z < maxZ) maxZ = obs.position.z;
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.position.z += speed;
                coin.rotation.z += 0.05;
                coin.box.setFromObject(coin);

                if (playerBox.intersectsBox(coin.box)) {
                    coinsCollected++;
                    document.getElementById('run-coins').innerText = coinsCollected;
                    scene.remove(coin);
                    coins.splice(i, 1);
                    continue;
                }

                if (coin.position.z > 5) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            if (maxZ > -180) {
                spawnRow(maxZ - 15);
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-coins').innerText = coinsCollected;
            document.getElementById('game-over-screen').classList.remove('hidden');
            saveCoinsToFirebase(coinsCollected);
        }

        function restartGame() {
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(coin => scene.remove(coin));
            obstacles = [];
            coins = [];

            currentLane = 0;
            targetX = 0;
            player.position.set(0, 0.6, 0);
            coinsCollected = 0;
            score = 0;
            isGameOver = false;

            document.getElementById('run-coins').innerText = "0";
            document.getElementById('game-over-screen').classList.add('hidden');

            spawnInitialObjects();
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init3D;
    </script>
</body>
</html>
